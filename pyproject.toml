[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "website-health-checker"
version = "0.1.0"
description = "A lightweight CLI tool to check website status and health"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
authors = [
    {name="Saridi", email="saridi.lim1103@gmail.com"}
]
dependencies = [
    "requests>=2.28.0"
]

[project.urls]
Homepage = "https://github.com/Saridi-The-Pro/Website-Health-Checker"

[project.scripts]
website-health-check = "website_health_checker.cli:main"