[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "website-health-checker"
version = "0.1.0"
description = "A lightweight CLI tool to check website status and health"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name="Saridi", email="saridi.lim1103@gmail.com"}
]
dependencies = [
    "requests>=2.28.0"
]
[project.scripts]
health-check = "website_health_checker.checker:main"